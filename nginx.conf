server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The trainer is a single-page app: any path resolves to index.html.
    # Matters once you add routes for sign-in and the leaderboard.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached or clients pin to a stale build
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # woff2 is already compressed; gzipping it again just burns cycles

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
}
