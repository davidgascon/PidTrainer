# Local development: builds from source.
services:
  app:
    build: .
    image: loop-lab:latest
    container_name: loop-lab
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      ADMIN_PIN: "${ADMIN_PIN:-22136969}"
    volumes:
      - looplab-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  looplab-data:
