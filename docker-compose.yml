services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: loop-lab:latest
    container_name: loop-lab
    restart: unless-stopped
    ports:
      # host:container — change the host side if 8080 is taken
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

