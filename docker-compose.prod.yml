services:
  web:
    # Set IMAGE in .env, e.g. ghcr.io/yourname/loop-lab
    # Pin TAG to a short sha to roll back: TAG=sha-1a2b3c4
    image: ${IMAGE:-ghcr.io/CHANGE-ME/loop-lab}:${TAG:-latest}
    pull_policy: always
    container_name: loop-lab
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
